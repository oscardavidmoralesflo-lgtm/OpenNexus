name: Deploy to VPS

# Runs /opt/opennexus/deploy.sh on the VPS. The deploy key is restricted in the
# server's authorized_keys to that script, so this job can do nothing else.
# The script pulls the branch, rebuilds changed services, checks health and
# rolls back on failure.
on:
  push:
    branches: [feature/panel-parity]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VPS: ubuntu@51.81.85.214
    steps:
      - name: Run deploy script
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_DEPLOY_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::Set the VPS_DEPLOY_KEY and VPS_KNOWN_HOSTS repository secrets"; exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "$VPS"
